spring.application.name=gdg
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://dist-two-ecru-35.vercel.app}
app.storage.root=${STORAGE_ROOT:./storage}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=45MB
